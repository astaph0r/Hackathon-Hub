spring.application.name=Hackerhub
spring.datasource.url=JDBC_MYSQL_URL
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=EMAIL_ID
spring.mail.password=EMAIL_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.mail=DEBUG
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

#liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

spring.security.oauth2.client.registration.google.client-id=GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=GOOGLE_CLIENT_SECRET


#custom
custom.feature.isDevelopment=true

custom.feature.adminEmail=ADMIN_EMAIL_ID

custom.feature.geminiAPI=GEMINI_API_KEY
